  html,body{margin:0;height:100%;overflow:hidden;background:#1d2b1f;font-family:Poppins,"Trebuchet MS",Verdana,sans-serif;font-weight:500;color:#3b2a1a;user-select:none}
  canvas{display:block;image-rendering:pixelated}
  .box{background:#f4e4bc;border:3px solid #7a4a2a;border-radius:8px;box-shadow:0 3px 0 #4a2f1a,0 6px 14px rgba(0,0,0,.35)}
  #hud{position:fixed;left:12px;top:var(--top,132px);padding:6px 10px;min-width:190px;font-size:13px;opacity:.93}
  #hud b{font-size:16px}
  .bar{height:12px;background:#c9b48a;border:2px solid #7a4a2a;border-radius:6px;margin:3px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%}
  #obj{position:fixed;right:12px;top:var(--top,132px);padding:6px 10px;max-width:260px;font-size:13px;opacity:.93}
  #obj small{display:block;color:#7a4a2a;font-weight:bold;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  #inv{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:6px 10px;display:flex;gap:10px;font-size:14px;font-weight:bold;white-space:nowrap}
  #inv span{display:flex;align-items:center;gap:3px}
  #help{position:fixed;left:12px;bottom:12px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;opacity:.85}
  .ic{width:24px;height:24px;image-rendering:pixelated;vertical-align:middle}
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 20px;width:min(520px,92vw);max-height:86vh;overflow:auto;font-size:15px}
  #panel h2{margin:0 0 4px;font-size:23px;font-weight:700;color:#5a3a1e}
  #panel h3{margin:14px 0 6px;font-size:15px;color:#7a4a2a;border-bottom:2px dashed #c9a26b;padding-bottom:2px}
  #panel p{margin:6px 0}
  .row{display:flex;align-items:center;gap:8px;padding:4px 0}
  .row .g{flex:1}
  button{font:inherit;font-weight:bold;background:#7fb04f;color:#fff;border:2px solid #3f6b28;border-radius:6px;padding:5px 10px;cursor:pointer;box-shadow:0 2px 0 #3f6b28}
  button:hover{background:#8fc25c}
  button:active{transform:translateY(2px);box-shadow:none}
  button.alt{background:#c98a3d;border-color:#7a4a2a;box-shadow:0 2px 0 #7a4a2a}
  button.red{background:#c94f3d;border-color:#7a2a1e;box-shadow:0 2px 0 #7a2a1e}
  button:disabled{background:#b9ad93;border-color:#8c8168;box-shadow:none;cursor:default;color:#eee}
  .ok{color:#3f6b28;font-weight:bold}.no{color:#b5332a;font-weight:bold}
  .close{position:absolute;right:10px;top:8px}
  .hidden{display:none!important}
  #toast{position:fixed;left:12px;top:calc(var(--top,132px) + 120px);width:190px;display:flex;flex-direction:column;gap:4px;align-items:stretch;pointer-events:none;z-index:30}      /* embaixo do painel do dia, da mesma largura (placeToast) */
.tmsg{display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;background:linear-gradient(#fffaf0,#f7e8c6);color:#3b2a1a;border:2px solid #7a4a2a;border-radius:9px;padding:4px 7px 6px;font-size:11px;font-weight:600;line-height:1.22;
  box-shadow:0 5px 0 rgba(74,47,26,.55),0 10px 22px rgba(0,0,0,.25);position:relative;overflow:hidden;animation:tIn .35s cubic-bezier(.2,1.4,.4,1)}
.tmsg.out{animation:tOut .4s forwards}
.tmsg .ti{flex:none;width:18px;height:18px;border-radius:50%;background:#f5d98a;border:1px solid #c9a26b;display:flex;align-items:center;justify-content:center;font-size:11px}
.tmsg .tt{flex:1}
.tmsg .tbar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#7fb04f,#f5c542);width:100%;transform-origin:left;animation:tBar 10s linear forwards}
@keyframes tIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(-10px) scale(.97)}}
@keyframes tBar{to{transform:scaleX(0)}}
@media (max-height:560px),(max-width:560px){.tmsg{font-size:9.5px;padding:3px 6px 5px;gap:5px;border-width:2px;border-radius:8px}.tmsg .ti{width:15px;height:15px;font-size:9px}}
  #panel.menu{width:min(640px,94vw);padding:0;overflow:hidden;display:flex;flex-direction:column}
  #panel[data-kind="menu"]{padding:0;width:min(600px,94vw);overflow:hidden;display:flex;flex-direction:column}
  .m-head{position:relative;color:#fff;padding:16px 22px 30px;background:linear-gradient(#54246e 0%,#8c3478 35%,#cc5268 62%,#f2804f 85%,#fab058 100%);overflow:hidden}
  .m-head::before{content:"";position:absolute;right:58px;top:10px;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff8c8 0 45%,#ffec96 46% 68%,rgba(255,236,150,0) 70%)}
  .m-head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:30px;background:
    linear-gradient(135deg,transparent 48%,#4ca040 50%) 0 0/36px 30px repeat-x,linear-gradient(225deg,transparent 48%,#4ca040 50%) 18px 0/36px 30px repeat-x;opacity:.95}
  .m-head .tag{display:inline-block;font-size:11px;letter-spacing:.25em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:3px 10px;border-radius:20px;margin-bottom:4px}
  .m-head h1{position:relative;margin:0;font-size:32px;font-weight:700;color:#ffe066;letter-spacing:.5px;text-shadow:0 3px 0 #b5532a,0 5px 0 #6e2a1a}
  .m-head .sub{position:relative;font-size:13px;opacity:.95;margin-top:4px}
  .m-head .close{z-index:2;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6);box-shadow:none;right:14px;top:14px}
  .m-body{padding:14px 20px 16px;overflow:auto;background:#fdf6e3}
  .m-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
  .m-stat{background:#fff;border:2px solid #e3cfa0;border-radius:12px;padding:7px 6px 6px;text-align:center;font-size:11.5px;line-height:1.2;color:#8a6a44;box-shadow:0 3px 0 #e3cfa0}
  .m-stat .e{display:block;font-size:19px;line-height:1.1}
  .m-stat b{display:block;font-size:17px;color:#3b2a1a}
  .m-prog{height:12px;background:#ead9b0;border:2px solid #c9a26b;border-radius:10px;overflow:hidden;margin:4px 0 14px}
  .m-prog i{display:block;height:100%;background:linear-gradient(90deg,#9be06a,#f5d76e,#e0a23a)}
  .m-play{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;font-size:19px;padding:13px;border-radius:14px;margin-bottom:12px;background:linear-gradient(#8fd45a,#4f9a2f);border-color:#2f5a1c;box-shadow:0 5px 0 #234513}
  .m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .m-btn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px 10px;font-size:14px;line-height:1.15;border-radius:14px;background:#fff;color:#3b2a1a;border:2px solid #e3cfa0;box-shadow:0 4px 0 #e3cfa0;text-shadow:none}
  .m-btn:hover{background:#fff8e6;transform:translateY(-1px)}
  .m-btn small{display:block;font-weight:500;font-size:11px;color:#8a6a44;margin-top:2px}

const inPedr=(x,y)=>x>=PEDR[0]&&x<=PEDR[2]&&y>=PEDR[1]&&y<=PEDR[3];
const PONDS_W=[[-86,52,4.5,3],[-58,10,6,3.5],[-122,70,5,4]];      // açudes do oeste (fazenda)
function genExpand(s1){
  const rn=mulberry32((s1^0x13579bdf)>>>0),I=(x,y)=>y*AW-XMIN+x,tr=o=>o==='tree'||o==='pine';
  const road=(x,y)=>{const i=I(x,y);if(ground[i]===2)ground[i]=3;else ground[i]=1;objs[i]=null};
  // natureza da parte nova: campo com bosques, beirada fechada
  for(let y=0;y<MH;y++)for(let x=XMIN;x<MW;x++){if(x<MW0&&y<MHB)continue;const i=I(x,y),u=rn(),v=rn();if(ground[i]!==0||lotAt[i])continue;

    else if(u<pt+pr)objs[i]='rock';else if(u<pt+pr+.02)objs[i]='bush';else if(u<pt+pr+.08)objs[i]='capim'}

  for(let y=PEDR[1];y<=PEDR[3];y++)for(let x=PEDR[0];x<=PEDR[2];x++){const i=I(x,y);if(ground[i]===2)continue;
    const cx=(PEDR[0]+PEDR[2])/2,cy=(PEDR[1]+PEDR[3])/2,d=Math.hypot((x-cx)/((PEDR[2]-PEDR[0])/2),(y-cy)/((PEDR[3]-PEDR[1])/2)),n=vnoise(x,y,s1+57,5);

    else if(u<.18)objs[i]='rock';else if(u<.26)objs[i]=rn()<.3?'pine':'tree';else if(u<.33)objs[i]='capim'}

  for(let x=105;x<=PEDR_ROAD+1;x++){road(x,24);road(x,25)}
  for(let y=24;y<=PEDR[1]+3;y++){road(PEDR_ROAD,y);road(PEDR_ROAD+1,y)}
  for(let x=PEDR_ROAD;x<=PEDR[0]+5;x++){road(x,PEDR[1]+2);road(x,PEDR[1]+3)}
  for(let y=PEDR[1]+4;y<=PEDR[1]+9;y++)for(let x=PEDR[0]+3;x<=PEDR[0]+6;x++){const i=I(x,y);objs[i]=null;if(ground[i]===0)ground[i]=5}      // pátio da entrada
  for(const s of SIGNS)if(s.pedr)for(let dy=-1;dy<=0;dy++)for(let dx=-2;dx<=2;dx++){const i=I(Math.floor(s.x)+dx,Math.floor(s.y)+dy);if(ground[i]!==1)objs[i]=null}
}
// ---- acabamento do mapa todo: açudes maiores, árvores mais espalhadas, menos pinheiros e capim na beira dos açudes ----
function finishNature(s1){

  for(let y=0;y<MH;y++){const rx=riverX(y),ponte=ok(rx,y)&&ground[I(rx,y)]===3;
    for(let x=rx-RIO_W;x<=rx+RIO_W;x++){if(!ok(x,y))continue;const i=I(x,y);if(lotAt[i]||vilaZ(x,y))continue;
      if(ponte){if(ground[i]===0||ground[i]===1||ground[i]===2){ground[i]=3;objs[i]=null}continue}
      if(ground[i]!==0)continue;let perto=false;for(let dy=-1;dy<=1&&!perto;dy++)for(let dx=-1;dx<=1;dx++){if(!ok(x+dx,y+dy))continue;const j=I(x+dx,y+dy);if(lotAt[j]||ground[j]===1||ground[j]===4||ground[j]===5){perto=true;break}}
      if(perto)continue;ground[i]=2;objs[i]=null}}
  // 1) açudes 40% maiores, com a beira irregular (nunca em cima de estrada, construção, vila ou lavoura)
  for(const[pi,[cx,cy,rx,ry]]of[...PONDS,...PONDS_W].entries()){const RX=rx*POND_K[pi],RY=ry*POND_K[pi];
    for(let y=Math.floor(cy-RY-1);y<=cy+RY+1;y++)for(let x=Math.floor(cx-RX-1);x<=cx+RX+1;x++){if(!ok(x,y))continue;const i=I(x,y);if(ground[i]!==0)continue;
      const k=((x+.5-cx)/RX)**2+((y+.5-cy)/RY)**2+(hash2(x,y,s1&1023)-.5)*.35;if(k>1)continue;
      if(lotPerto(x,y,2)||vilaZ(x,y)||(x>=FARM[0]-1&&x<=FARM[2]+1&&y>=FARM[1]-1&&y<=FARM[3]+1)||pontos.some(([px,py])=>Math.abs(px-x-.5)<3&&Math.abs(py-y-.5)<3))continue;

  // 2) menos pinheiros (araucárias): mais da metade vira árvore comum

  const dens=t=>{const x=(t%AW+XMIN),y=(t/AW)|0;let n=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(ok(x+dx,y+dy)&&tr(objs[I(x+dx,y+dy)]))n++;return n};

    if(livre)kept[i]=1;else objs[i]=rn()<.3?'capim':null}
  // 3b) mais árvores: novas mudas nos campos abertos (longe de estrada, construção e cidade), sempre com folga
  for(let y=3;y<MH-3;y++)for(let x=XMIN+3;x<MW-3;x++){const i=I(x,y);if(ground[i]!==0||objs[i]||lotAt[i]||vilaZ(x,y))continue;
    if(x>=CITY_ZONE[0]-2&&x<=CITY_ZONE[2]+2&&y>=CITY_ZONE[1]-2&&y<=CITY_ZONE[3]+2)continue;if(x>=FARM[0]-1&&x<=FARM[2]+1&&y>=FARM[1]-1&&y<=FARM[3]+1)continue;if(inPedr(x,y))continue;
    const n=vnoise(x,y,s1+91,8);if(rn()>(n>.55?.12:.035))continue;if(lotPerto(x,y,1))continue;
    let livre=true;for(let dy=-2;dy<=2&&livre;dy++)for(let dx=-2;dx<=2;dx++)if(tr(objs[I(x+dx,y+dy)])){livre=false;break}
    if(livre)objs[i]=rn()<.12?'pine':'tree'}

  const lago=(x,y)=>G(x,y)===2;
  for(let y=1;y<MH-1;y++)for(let x=XMIN+1;x<MW-1;x++){const i=I(x,y);if(ground[i]!==0||objs[i]||lotAt[i])continue;
    let d=9;for(let dy=-3;dy<=3&&d>1;dy++)for(let dx=-3;dx<=3;dx++)if(lago(x+dx,y+dy)&&Math.abs(x+dx-riverX(y+dy))>RIO_W){d=Math.min(d,Math.max(Math.abs(dx),Math.abs(dy)))}

function buildHead(w){
  const H=HEADS[w];H.cv=null;if(!H.cfg||!H.cfg.src){refreshPanel();return}

  im.onload=()=>{const D=H.cfg.big?54:38,c=document.createElement('canvas');c.width=c.height=D;const g=c.getContext('2d');
    g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.save();g.beginPath();g.arc(D/2,D/2,D/2-2,0,Math.PI*2);g.clip();g.drawImage(im,0,0,D,D);g.restore();

}

// Os áudios são decodificados e tocados pela Web Audio API (o mesmo caminho dos bipes do jogo), sem depender de <audio> nem de links blob:
function getCtx(){actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended'&&actx.resume)actx.resume();return actx}
function decodeSound(k,ab,done){try{const c=getCtx(),ok=b=>{sndBuf[k]=b;sndHas[k]=1;done&&done(true)},bad=()=>{done&&done(false)};
  const pr=c.decodeAudioData(ab,ok,bad);if(pr&&pr.catch)pr.catch(()=>{})}catch(e){done&&done(false)}}

  rq.onsuccess=()=>{sndDB=rq.result;try{const st=sndDB.transaction('sons').objectStore('sons');
    for(const k in SOUNDS){const g=st.get(k);g.onsuccess=()=>{if(g.result){sndHas[k]=1;decodeSound(k,g.result.slice(0),()=>refreshPanel())}}}}catch(e){}}}catch(e){}}
function setSound(k,file){
  if(!file||!(/^audio\//.test(file.type)||/\.(mp3|wav|ogg|m4a|aac|opus|flac)$/i.test(file.name||''))){toast('Escolha um arquivo de áudio (MP3, WAV, OGG...).');return}
  if(file.size>4*1024*1024){toast('Áudio grande demais (máximo 4 MB). Use um trecho curto.');return}
  const fr=new FileReader();
  fr.onerror=()=>toast('Não consegui abrir esse arquivo.');
  fr.onload=()=>{const ab=fr.result;let saved=false;
    try{if(sndDB){sndDB.transaction('sons','readwrite').objectStore('sons').put(ab.slice(0),k);saved=true}}catch(e){}
    decodeSound(k,ab,ok=>{if(!ok){toast('Não consegui ler esse áudio. Tente um arquivo MP3 ou WAV.');return}
      toast(saved?'Áudio salvo! Tocando...':'Áudio carregado só para esta sessão (o navegador não deixou guardar). Tocando...');refreshPanel();playSound(k,1,true,true)})};
  fr.readAsArrayBuffer(file)}
function removeSound(k){try{if(sndSrc[k])sndSrc[k].stop()}catch(e){}delete sndBuf[k];delete sndHas[k];try{if(sndDB)sndDB.transaction('sons','readwrite').objectStore('sons').delete(k)}catch(e){}}
function playSound(k,vol,force,evenMuted){      // devolve true se existe áudio personalizado para esse som
  if(!sndHas[k])return false;if((muted&&!evenMuted)||!sndBuf[k])return true;
  const now=performance.now();if(!force&&sndLast[k]&&now-sndLast[k]<1200)return true;sndLast[k]=now;
  try{const c=getCtx();try{if(sndSrc[k])sndSrc[k].stop()}catch(e){}
    const s=c.createBufferSource(),g=c.createGain();s.buffer=sndBuf[k];g.gain.value=clamp(vol==null?1:vol,0,1);s.connect(g);g.connect(c.destination);s.start();sndSrc[k]=s}catch(e){}
  return true}

  for(const el of[...box.children])if(el.dataset.m===msg){el.remove()}      // mesma mensagem: reinicia
  const m=msg.match(/^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍(?:\p{Extended_Pictographic}))*(?:\s*(?:\p{Extended_Pictographic})(?:️)?)?)\s*/u),ico=m?m[1]:'💬',txt=m?msg.slice(m[0].length):msg;
  const el=document.createElement('div');el.className='tmsg';el.dataset.m=msg;el.innerHTML=`<span class="ti"></span><span class="tt"></span><i class="tbar"></i>`;el.querySelector('.ti').textContent=ico;el.querySelector('.tt').textContent=txt;el.querySelector('.tbar').style.animationDuration=(ms/1000)+'s';if(ms>TOAST_MS)el.dataset.long=1;if(/^❗/.test(msg))el.classList.add('tred');
  box.appendChild(el);while(box.children.length>(isTouch?2:3)){const curto=[...box.children].find(c=>!c.dataset.long&&c!==el);(curto||box.firstChild).remove()}      // no celular só 2; as mensagens longas (bolsa) ficam, saem as comuns
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),420)},ms)}

  for(const e of(state&&state.extras)||[]){const[x0,y0,w,hh]=extraLot(e);for(let y=y0;y<y0+hh;y++)for(let x=x0;x<x0+w;x++)lotAt[y*AW-XMIN+x]='ex:'+e.id}}
const extraNivel=t=>bldNivel(t,1)+2;      // galinheiro extra: nível 3; curral extra: nível 4
const extraPreco=t=>{const c=costOf(t,2),k=Math.pow(1.5,extrasDe(t).length);return{c:Math.round(c.c*k/10)*10,m:Math.round(c.m*k),p:Math.round(c.p*k)}};      // cada um a mais fica 50% mais caro

function extraValido(t,x0,y0){const[,,w,hh]=BLD[t].lot;for(let y=y0;y<=y0+hh;y++)for(let x=x0;x<x0+w;x++){      // a linha da frente (porta) também precisa estar livre
  if(x<XMIN||y<0||x>=MW||y>=MH)return false;const i=y*AW-XMIN+x,o=objs[i],v=vilaZ(x,y);
  if(lotAt[i]||soilOn(i)||(v&&!vilaAberta(v)))return false;if(y<y0+hh&&ground[i]!==0)return false;if(y===y0+hh&&(ground[i]===2||ground[i]===3))return false;
  if(o&&o!=='capim'&&!state.depleted[i])return false}
  for(const a of penAnim.concat(wild))if(a.x>=x0&&a.x<=x0+w&&a.y>=y0&&a.y<=y0+hh)return false;return true}
function stockTotal(id){return Object.values(state.stock[id]).reduce((a,b)=>a+b,0)}
function advanceAnimals(m){for(const a of state.animals){const sp=SPECIES[a.sp],eff=Math.min(m,a.fed);a.fed-=eff;a.prog+=eff;
  const need=sp.every*60,st=state.stock[sp.pen],cap=capTotal(sp.pen)*4;
  while(a.prog>=need){if(stockTotal(sp.pen)<cap){const pk=prodOf(a);st[pk]=(st[pk]||0)+1;a.prog-=need}else{a.prog=need;break}}}}

/* ---------- Animais soltos / moradores ---------- */
const TOEFD_COR=7,TOEFD_CHANCE=1/500,TOEFD_EVERY=300;      // a cada 5 minutos (reais) jogando, 1 chance em 500
function spawnToefd(quiet){if(wild.some(a=>a.sp==='galinha'&&a.cor===TOEFD_COR))return true;const z=SPECIES.galinha.zone;
  for(let t=0;t<200;t++){const x=z[0]+Math.random()*(z[2]-z[0]),y=z[1]+Math.random()*(z[3]-z[1]);
    if(inVila(x,y,1)||inFarm(x,y,1)||!canStand(x,y,.3))continue;
    wild.push({sp:'galinha',x,y,vx:0,vy:0,timer:2,flee:0,face:1,cor:TOEFD_COR});state.toefdWild=true;
    if(!quiet){toast('🏆💪 Uma GALINHA T.O.E.F.D apareceu em algum lugar do mapa! Cada ovo dela vale R$ 3.000,00. Abra o mapa (M)!');for(let i=0;i<4;i++)setTimeout(()=>beep(520+i*130,.12,'square',.05),i*120)}return true}return false}
function updateToefd(dt){state.toefdT=(state.toefdT||0)+dt;if(state.toefdT>=TOEFD_EVERY){state.toefdT=0;if(!state.toefdWild&&Math.random()<TOEFD_CHANCE)spawnToefd()}}
function spawnWild(){
  const rn=Math.random;
  for(const sp in SPECIES){const d=SPECIES[sp];let n=wild.filter(a=>a.sp===sp).length;
    for(let t=0;t<60&&n<d.cap;t++){const z=d.zone2&&rn()<.6?d.zone2:d.zone,x=z[0]+rn()*(z[2]-z[0]),y=z[1]+rn()*(z[3]-z[1]);      // 60% perto da fazenda nova
      if(inVila(x,y,1))continue;
      if(inFarm(x,y,1))continue;      // bicho solto não nasce dentro da fazenda
      if(!canStand(x,y,.3)||Math.hypot(x-state.p.x,y-state.p.y)<4)continue;
      wild.push({sp,x,y,vx:0,vy:0,timer:rn()*2,flee:0,face:1,cor:pickCor(sp)});n++}}
}
const inVila=(x,y,m)=>{m=m||0;return x>=CITY_ZONE[0]-m&&x<=CITY_ZONE[2]+1+m&&y>=CITY_ZONE[1]-m&&y<=CITY_ZONE[3]+1+m};      // Videira: bicho solto não entra
const inFarm=(x,y,m)=>{m=m||0;return x>=FARM[0]-m&&x<=FARM[2]+1+m&&y>=FARM[1]-m&&y<=FARM[3]+1+m};
function penBox(pen,sp){const hw=SPR[sp]?SPR[sp].width*S/T/2:.5;      // [xmin,xmax,ymin,ymax] para o animal caber inteiro dentro da cerca
  return[pen[0]+.15+hw,pen[0]+pen[2]-.15-hw,pen[1]+.95,pen[1]+pen[3]-.75]}
function syncPens(){const ins={},used={};for(const t of['galinheiro','curral']){ins[t]=penInsts(t);used[t]=ins[t].map(()=>0)}
  const velhos=penAnim.slice(),pego=new Set();      // no multiplayer a lista de bichos chega nova toda hora: reaproveita o mesmo bicho (sem teletransportar)
  penAnim=state.animals.map((a,i)=>{const t=SPECIES[a.sp].pen,L=ins[t]||[];let k=L.findIndex((q,j)=>used[t][j]<q.cap);if(k<0)k=0;if(L.length)used[t][k]++;      // enche um cercado e passa para o próximo
    const pen=L.length?L[k].pen:BLD[t].pen,b=penBox(pen,a.sp),mesmo=p=>!pego.has(p)&&p.sp===a.sp&&(p.cor|0)===(a.cor|0)&&p.pen&&p.pen[0]===pen[0]&&p.pen[1]===pen[1];
    const old=velhos.find(p=>p.ref===a&&mesmo(p))||(velhos[i]&&mesmo(velhos[i])?velhos[i]:null)||velhos.find(mesmo);
    if(old){pego.add(old);old.ref=a;return old}
    return{ref:a,sp:a.sp,cor:a.cor|0,pen,x:b[0]+Math.random()*(b[1]-b[0]),y:b[2]+Math.random()*(b[3]-b[2]),vx:0,vy:0,timer:Math.random()*2,face:1}})}
function syncNPCs(){const n=Math.min(16,state.b.praca*2);while(npcs.length<n)npcs.push({x:24.5,y:23.5,vx:0,vy:0,timer:0,dir:'down',walk:0,look:npcs.length%4});npcs.length=Math.min(npcs.length,n)}
function wander(e,dt,speed,zone){
  e.timer-=dt;
  if(e.timer<=0){e.timer=1+Math.random()*3;
    if(Math.random()<.4){e.vx=e.vy=0}else{let a=Math.random()*Math.PI*2;
      if(zone&&(e.x<zone[0]||e.x>zone[2]||e.y<zone[1]||e.y>zone[3]))a=Math.atan2((zone[1]+zone[3])/2-e.y,(zone[0]+zone[2])/2-e.x);
      e.vx=Math.cos(a)*speed;e.vy=Math.sin(a)*speed}}
  if(e.vx||e.vy){if(!move(e,e.vx*dt,e.vy*dt,.3))e.timer=0;if(e.vx)e.face=e.vx>0?1:-1}
}

    let acc=0;for(const[kk,pp]of T){acc+=pp;if(r<acc){k=kk;break}}}
  state.clima=k;if(k)setTimeout(()=>toast(CLIMA[k].msg),1500)}
const climaHoje=k=>state&&state.clima===k;
const rainVis=()=>state.rain&&!(state.arco&&state.min>=930);      // depois da chuva, às vezes ela para no fim da tarde e aparece o arco-íris

    const W=cv.width,x=40+Math.random()*(W-80),pts=[[x,0]];let y=0,xx=x;while(y<SKYH-10){y+=10+Math.random()*12;xx+=(Math.random()-.5)*26;pts.push([xx,y])}bolt={pts,t:.25};

/* ================= MULTIPLAYER: cooperativo no mundo do dono, até 4 jogadores, pela internet com código de sala =================
   Ligação: WebRTC (canal de dados direto entre os aparelhos). Para os aparelhos se acharem usa o servidor público grátis do PeerJS
   só como "telefonista" (sinalização). Quem hospeda manda no mundo; os convidados mandam o que fazem e o dono aplica e espalha. */
const JOGO_VERSAO='2026-11-21o';      // muda a cada entrega: o dono avisa se alguém entrar com versão diferente
const MP_MAX=4,MP_PREFIX=SLOT_KEYS[0].replace(/_slot_1$/,'').replace(/_/g,''),MP_SERVER='wss://0.peerjs.com:443/peerjs?key=peerjs';
const MP_ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},{urls:'stun:global.stun.twilio.com:3478'}]};
const MP_LEVE=['p','energy','hunger','vida','forca','sujeira','sel','testoUntil','fomeT','coins','xpUntil','monster','napHoje','doze'];      // muda toda hora: vai junto em cada batida
const MP_PROG=['inv','seeds','nivel','flags','roupas','visual','estudos','found','motos','moto','tratores','trator','fuel','vsuj'];      // progresso de cada jogador: mochila, peixes, sementes, nível, roupas, veículos…
const MP_PESSOAL=[...MP_LEVE,...MP_PROG];      // cada jogador tem o seu; o resto do state é o mundo do dono
const MP_FORA_DIFF=new Set([...MP_PESSOAL,'saved','min','day','rain','clima','riding','rideKind','jogs','progDono']);
// o progresso de quem não é o dono fica guardado no próprio mundo, pelo nome (volta igual quando a pessoa entra de novo)
function progNovo(){const n=newState(),o={};for(const k of MP_PROG)o[k]=n[k];return o}
function progDe(o){const r={};for(const k of MP_PROG)r[k]=o[k];return JSON.parse(JSON.stringify(r))}

function nvOuvir(path,onMsgs){const url=`${NV.url}/${MP_PREFIX}/${path}.json`;const vistos=new Set();let es=null,poll=null,aberto=false,fim=false,apagar=[],apT=null;
  const limpar=()=>{if(!apagar.length)return;const o={};for(const k of apagar)o[k]=null;apagar=[];nvReq(path,'PATCH',o).catch(()=>{})};
  const receber=obj=>{if(!obj||typeof obj!=='object')return;const ks=Object.keys(obj).filter(k=>!vistos.has(k)).sort();
    for(const k of ks){vistos.add(k);apagar.push(k);const v=obj[k];try{onMsgs(Array.isArray(v)?v:[v])}catch(e){}}
    if(vistos.size>400){for(const k of [...vistos])if(!(k in obj))vistos.delete(k)}};
  let pedindo=false;const perguntar=()=>{if(fim)return;poll=setInterval(()=>{if(fim||pedindo)return;pedindo=true;nvReq(path).then(o=>{pedindo=false;receber(o)},()=>{pedindo=false})},250)};
  apT=setInterval(limpar,2000);
  if(typeof EventSource==='function'){try{es=new EventSource(url);
      const ev=e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}if(!d)return;aberto=true;
        if(d.path==='/'){receber(d.data)}else{const k=String(d.path).split('/')[1];if(k&&d.data!=null){const o={};o[k]=d.data;receber(o)}}};
      es.addEventListener('put',ev);es.addEventListener('patch',ev);es.onopen=()=>{aberto=true};
      setTimeout(()=>{if(!aberto&&!fim){try{es.close()}catch(e){}es=null;perguntar()}},4000);es.onerror=()=>{if(!aberto&&!fim&&!poll){try{es.close()}catch(e){}es=null;perguntar()}}}catch(e){es=null;perguntar()}}
  else perguntar();
  return{close(){fim=true;try{es&&es.close()}catch(e){}clearInterval(poll);clearInterval(apT);limpar()}}}

function nickBind(){const ni=$('nick');if(!ni||!ni.addEventListener)return;ni.addEventListener('input',()=>{const a=$('nickav');if(a)a.textContent=(ni.value.trim()[0]||'?').toUpperCase()});ni.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter'){ev.preventDefault();ACT.nicksalva()}});const nc=$('nickcod');if(nc&&nc.addEventListener)nc.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter'){ev.preventDefault();ACT.nickcod()}})}
function mpLerNome(){if(NICK&&NICK.n){MP.nome=NICK.n;return}const el=$('mpnome');if(el&&el.value!=null){MP.nome=mpLimpo(el.value);try{localStorage.setItem(MP_PREFIX+'_mpnome',MP.nome)}catch(e){}}}

/* ---------- Mundo na nuvem (Firebase Realtime Database pela API REST) ----------
   O mundo fica guardado na internet. Quem entra primeiro vira o dono (hospeda a sala);
   quem chega depois entra na sala dele. Quando o dono sai, salva na nuvem e o próximo assume. */
const NV_SLOT=3,NV_VIVO=45000,NV_BATIDA=15000,NV_SUBIR=60000;
const NV_PADRAO='https://imbuial-valley-default-rtdb.firebaseio.com';      // banco do Alison (versão dos amigos)
const NV={url:(()=>{try{return localStorage.getItem(MP_PREFIX+'_nuvemurl')||NV_PADRAO}catch(e){return NV_PADRAO}})(),
  lista:(()=>{try{return JSON.parse(localStorage.getItem(MP_PREFIX+'_nuvens')||'[]')}catch(e){return[]}})(),
  id:null,on:false,lockId:null,hb:null,upT:0,subindo:false,status:'',pess:null,pend:{},convite:null,ocupado:null,tentando:false};
function nvGuardar(){try{localStorage.setItem(MP_PREFIX+'_nuvemurl',NV.url);localStorage.setItem(MP_PREFIX+'_nuvens',JSON.stringify(NV.lista.slice(0,8)))}catch(e){}}
// aceita "https://x.firebaseio.com/", "x-default-rtdb.firebaseio.com", "x-default-rtdb", "x.southamerica-east1.firebasedatabase.app"
function nvUrl(t){t=String(t||'').trim().replace(/^https?:\/\//i,'').replace(/\/.*$/,'').toLowerCase();if(!t)return'';
  if(!/^[a-z0-9.-]+$/.test(t))return'';if(!t.includes('.'))t+='.firebaseio.com';return'https://'+t}
const nvCurto=u=>String(u||'').replace(/^https:\/\//,'').replace(/\.firebaseio\.com$/,'');
const nvConvite=(id,url)=>`${id}@${nvCurto(url||NV.url)}`;
function nvLerConvite(t){t=String(t||'').trim();const [a,b]=t.split('@');let id=String(a||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(id.length===8)id=id.slice(0,4)+'-'+id.slice(4);
  return{id:/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(id)?id:null,url:b?nvUrl(b):NV.url}}
function nvNovoId(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++){s+=L[Math.random()*L.length|0];if(i===3)s+='-'}return s}
const nvChave=n=>(String(n||'').replace(/[.#$\[\]\/]/g,'_').trim()||'Sem nome').slice(0,24);
// conversa com o banco
function nvReq(path,metodo,corpo,url){const u=`${url||NV.url}/${MP_PREFIX}/${path}.json`;let to=null;
  const op={method:metodo||'GET'};if(corpo!==undefined){op.headers={'Content-Type':'application/json'};op.body=JSON.stringify(corpo)}      // sem AbortSignal/keepalive: alguns navegadores e janelas embutidas não aceitam
  const limite=new Promise((_,rej)=>{to=setTimeout(()=>rej(new Error('rede: demorou demais (15 s)')),15000)});
  return Promise.race([fetch(u,op),limite])
    .then(r=>{clearTimeout(to);if(r.status===401||r.status===403)throw new Error('regras');if(!r.ok)return r.text().then(t=>{let m='';try{m=JSON.parse(t).error||''}catch(e){m=t.slice(0,80)}throw new Error('HTTP '+r.status+(m?' — '+m:''))});return r.json()},
      e=>{clearTimeout(to);if(e&&(e.message==='regras'||/^(HTTP|rede)/.test(e.message)))throw e;throw new Error('rede: '+(e&&e.message||e))})}
const NV_AGORA={'.sv':'timestamp'};
const nvErro=e=>e&&e.message==='regras'?'O banco recusou: falta publicar as Regras no Firebase (passo 4).':/^HTTP/.test(e&&e.message)?'O banco respondeu com erro: '+e.message:'Sem conexão com o banco ('+String(e&&e.message||'erro').replace(/^rede: /,'')+'). Endereço: '+nvCurto(NV.url);
/* ---------- Nick registrado: único no banco, troca só a cada 30 dias ----------
   O nick fica em imbuialvalley/nicks/<nome em minúsculas> = {n, u (aparelho), h (código do nick embaralhado), t}.
   Em outro aparelho, a mesma pessoa usa o "código do nick" pra pegar o mesmo nome. */
const NICK_DIAS=30,NICK_MS=NICK_DIAS*864e5;
let nickDig='';
let NICK=(()=>{try{return JSON.parse(localStorage.getItem(MP_PREFIX+'_nickreg')||'null')}catch(e){return null}})(),nickMsg='',nickOcupado=false;
const NICK_UID=(()=>{try{let u=localStorage.getItem(MP_PREFIX+'_uid');if(!u){u=nvNovoId().replace('-','')+nvNovoId().replace('-','');localStorage.setItem(MP_PREFIX+'_uid',u)}return u}catch(e){return'X'+Math.random().toString(36).slice(2)}})();
const nickChave=n=>String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[.#$\[\]\/\s]/g,'_').slice(0,24);
const nickHash=s=>{s=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)};
function nickGuardar(){try{localStorage.setItem(MP_PREFIX+'_nickreg',JSON.stringify(NICK))}catch(e){}}
const nickTemBanco=()=>!!NV.url;
function nickFalta(){if(!NICK)return 0;return Math.max(0,NICK.t+NICK_MS-Date.now())}
const nickDiasFalta=()=>Math.ceil(nickFalta()/864e5);
function nickPronto(){if(NICK&&NICK.n){MP.nome=NICK.n;return true}if(!nickTemBanco()&&MP.nome)return true;
  toast('Escolha e salve o seu nick na tela inicial primeiro.');return false}
function nickFim(n,t,cod){nickDig='';NICK={n,t,c:cod||(NICK&&NICK.c)||''};nickGuardar();nickSet(n);nickMsg='✅ Nick salvo!';nickOcupado=false;nickTela()}
function nickTela(){if(panelKind==='title')openTitle();else if(panelKind==='mp')openMP()}
function nickSalvar(v,codigo){const n=mpLimpo(v);nickOcupado=false;nickDig=n;
  if(n.length<3){nickMsg='⚠️ O nick precisa de pelo menos 3 letras.';return nickTela()}
  if(NICK&&n===NICK.n){nickMsg='Esse já é o seu nick.';return nickTela()}
  if(NICK&&nickFalta()>0){nickMsg=`⏳ Você só pode trocar o nick daqui a ${nickDiasFalta()} dia(s).`;return nickTela()}
  if(!nickTemBanco()){nickFim(n,Date.now());return}
  const k=nickChave(n),antigo=NICK&&NICK.n&&nickChave(NICK.n)!==k?nickChave(NICK.n):null;
  nickMsg='🔎 Verificando se alguém já usa esse nick…';nickTela();
  return nvReq('nicks/'+k).then(r=>{
    if(r&&r.u!==NICK_UID){
      if(codigo&&r.h&&nickHash(codigo)===r.h){return nvReq('nicks/'+k+'/u','PUT',NICK_UID).then(()=>nickFim(r.n,r.t||Date.now(),String(codigo).toUpperCase()))}      // é a mesma pessoa em outro aparelho
      nickOcupado=n;nickMsg=codigo?'❌ Código errado para esse nick.':`❌ Já tem alguém com o nick "${mpEsc(r.n||n)}". Escolha outro — ou, se ele é seu, digite o código do nick.`;return nickTela()}
    const cod=nvNovoId(),t=Date.now();
    return nvReq('nicks/'+k,'PUT',{n,u:NICK_UID,h:nickHash(cod),t}).then(()=>nvReq('nicks/'+k)).then(c=>{
      if(!c||c.u!==NICK_UID){nickOcupado=n;nickMsg='❌ Alguém pegou esse nick agora mesmo. Escolha outro.';return nickTela()}
      if(antigo)nvReq('nicks/'+antigo).then(o=>{if(o&&o.u===NICK_UID)nvReq('nicks/'+antigo,'DELETE')}).catch(()=>{});
      nickFim(n,t,cod)})
  }).catch(e=>{nickMsg='⚠️ '+nvErro(e)+' — o nick não foi salvo, tente de novo.';nickTela()})}
function nickHTML(){const reg=NICK&&NICK.n,trava=reg&&nickFalta()>0;
  const info=reg?(trava?`✅ Nick registrado · pode trocar daqui a <b>${nickDiasFalta()} dia(s)</b>`:'✅ Nick registrado · já pode trocar se quiser'):(nickTemBanco()?'Escolha um nick e toque em Salvar — ninguém mais vai poder usar o mesmo.':'Escolha um nick e toque em Salvar.');
  return `<div class="nickbox"><span class="mpav big" id="nickav" style="background:#f2b233">${mpEsc(((reg?NICK.n:MP.nome)||'?')[0].toUpperCase())}</span><div class="g"><b>Seu nick</b><small>Aparece em cima do seu boneco e no chat do multiplayer</small>
    <div class="nickrow"><input id="nick" maxlength="18" value="${mpEsc((reg&&nickFalta()>0?NICK.n:(nickDig||(reg?NICK.n:MP.nome)))||'')}" placeholder="Escolha um apelido (ex.: Teus)" autocomplete="off" ${trava?'disabled':''}>${trava?'':'<button class="nickok" data-a="nicksalva">💾 Salvar</button>'}</div>
    ${nickOcupado?`<div class="nickrow"><input id="nickcod" maxlength="9" placeholder="Código do nick (ex.: AB12-CD34)" autocomplete="off"><button class="nickok alt" data-a="nickcod">É meu</button></div>`:''}
    <small class="nickst">${nickMsg||info}</small>${reg&&NICK.c?`<small class="nickst">🔑 Código do nick: <b>${mpEsc(NICK.c)}</b> — use para entrar com esse nick em outro celular/PC.</small>`:''}</div></div>`}
// dados pessoais de cada jogador no mundo da nuvem
function nvPessDe(o,testoMin){return{coins:Math.round((o.coins||0)*100)/100,forca:o.forca||{lvl:1,xp:0,hoje:0},testo:Math.max(0,Math.round(testoMin||0)),energy:Math.round(o.energy||0),hunger:Math.round(o.hunger==null?80:o.hunger),sujeira:o.sujeira||0}}
function nvMinhaPess(){return nvPessDe(state,testoLeft())}
function nvAplicarPess(p){if(!p){state.coins=20;state.forca={lvl:1,xp:0,hoje:0};state.testoUntil=0;state.energy=maxEnergy();state.hunger=80;state.sujeira=0;return}
  if(p.coins!=null)state.coins=+p.coins||0;state.forca=Object.assign({lvl:1,xp:0,hoje:0},p.forca);state.testoUntil=p.testo>0?absNow()+p.testo:0;state.energy=Math.max(20,Math.min(maxEnergy(),p.energy||maxEnergy()));state.hunger=p.hunger==null?80:p.hunger;state.sujeira=p.sujeira||0}
// ---------- criar um mundo na nuvem a partir do mundo aberto ----------
function nvCriar(n){if(!NV.url){NV.status='Primeiro cole o endereço do banco (passo 3).';openNuvem();return}
  if(n==null||n==='')n=curSlot;n=+n;if(!(n>=0&&n<3)){NV.status='Escolha um dos seus mundos (espaço 1, 2 ou 3).';openNuvem();return}
  if(n===curSlot)save();const sv=load(n);if(!sv){NV.status='Esse espaço está vazio.';openNuvem();return}
  const dur=(sv.testoUntil||0)-((sv.day-1)*1440+((sv.min-360+1440)%1440));
  const id=nvNovoId(),nick=nvChave(MP.nome||'Dono'),jog={};sv.progDono=nick;jog[nick]=nvPessDe(sv,dur);const nome=sv.nome||'Mundo '+(n+1);
  NV.status='Enviando o mundo…';openNuvem();
  nvReq(id,'PUT',{info:{nome,criado:NV_AGORA,por:MP.nome||'',dia:sv.day},save:JSON.stringify(sv),jogadores:jog})
    .then(()=>{NV.lista=[{id,url:NV.url,nome,por:MP.nome||''},...NV.lista.filter(w=>w.id!==id)];nvGuardar();NV.convite=nvConvite(id);
      NV.status='Mundo na nuvem criado! Passe o código para os amigos.';toast('☁️ Mundo enviado para a nuvem!',6000);sfx.coin();openNuvem()})
    .catch(e=>{NV.status=nvErro(e);openNuvem()})}
// ---------- entrar num mundo da nuvem ----------
function nvEntrar(txt,forcar){const c=nvLerConvite(txt);if(!c.id){NV.status='Código inválido. Ele tem 8 letras/números, assim: KX7P-M2QA';openNuvem();return}
  if(!c.url){NV.status='Falta o endereço do banco (passo 3)';openNuvem();return}
  if(MP.role||NV.tentando)return;NV.tentando=true;NV.url=c.url;nvGuardar();NV.ocupado=null;
  if(curSlot!=null&&curSlot!==NV_SLOT)save();
  const id=c.id,nick=nvChave(MP.nome||'Jogador');NV.status='Procurando o mundo…';openNuvem();
  let info,agora;
  nvReq(id+'/info').then(i=>{if(!i)throw new Error('sumiu');info=i;return nvReq(id+'/ping','PUT',NV_AGORA)})
   .then(t=>{agora=+t||Date.now();return nvReq(id+'/lock')})
   .then(lk=>{NV.lista=[{id,url:NV.url,nome:info.nome||'Mundo',por:info.por||''},...NV.lista.filter(w=>w.id!==id)];nvGuardar();NV.dono=info.por||'';
     if(!forcar&&lk&&lk.sala&&lk.sala===NV.salaMorta&&agora-(+lk.t||0)<NV_VIVO){if(agora-(+lk.t||0)>17000){NV.salaMorta=null;return nvAssumir(id,info,nick)}
       NV.tentando=false;NV.status='Esperando o mundo ficar livre…';setTimeout(()=>{if(!MP.role)nvEntrar(txt)},3000);return}
     if(!forcar&&lk&&lk.sala&&agora-(+lk.t||0)<NV_VIVO&&String(lk.nick||'')!==String(MP.nome||'')){      // se quem "está jogando" é você mesmo (outra aba/aparelho que fechou), abre direto      // alguém já está jogando: entra na sala dele
       return nvReq(id+'/jogadores/'+encodeURIComponent(nick)).then(p=>{NV.tentando=false;NV.pess=p||null;NV.id=id;NV.ocupado={nome:lk.nick||'alguém',sala:lk.sala};
         MP.nuvem=id;NV.status=`${lk.nick||'Alguém'} está jogando agora — entrando na sala dele…`;if(panelKind==='nuvem')closePanel();mpEntrar(lk.sala)})}
     return nvAssumir(id,info,nick)})
   .catch(e=>{NV.tentando=false;NV.status=e&&e.message==='sumiu'?'Mundo não encontrado. Confira o código.':nvErro(e);openNuvem()})}
function nvAssumir(id,info,nick){const meu=Math.random().toString(36).slice(2,10),sala=mpCodigo();
  NV.status='Abrindo o mundo…';openNuvem();
  return nvReq(id+'/lock','PUT',{id:meu,nick:MP.nome||'',sala,t:NV_AGORA})
   .then(()=>new Promise(r=>setTimeout(r,1200))).then(()=>nvReq(id+'/lock'))
   .then(lk=>{if(!lk||lk.id!==meu){NV.tentando=false;NV.status='Outra pessoa entrou junto — tentando de novo…';openNuvem();setTimeout(()=>nvEntrar(nvConvite(id)),1500);return}
     return Promise.all([nvReq(id+'/save'),nvReq(id+'/jogadores')]).then(([sv,jog])=>{
       let s=null;try{s=JSON.parse(sv)}catch(e){}if(!s||!s.b){throw new Error('save')}
       try{localStorage.setItem(SLOT_KEYS[NV_SLOT],JSON.stringify(s))}catch(e){}const w=load(NV_SLOT);if(!w)throw new Error('save');
       NV.tentando=false;NV.id=id;NV.on=true;NV.lockId=meu;NV.pend={};NV.upT=0;NV.jog=jog||{};
       if(panelKind)closePanel();curSlot=NV_SLOT;titleMode=null;startGame(w);nvAplicarPess((jog||{})[nick]);
       if(!state.progDono){const era=nvChave(info&&(info.subiu||info.por)||'');if(era&&era!==nick)state.progDono=era}      // mundo sem dono marcado: o que está nele é de quem subiu por último
       progTroca(nick);NV.assT=Date.now();
       {const pp=(w.mpPos||{})[nick];if(pp&&canStand(pp.x,pp.y,.28)){state.p.x=pp.x;state.p.y=pp.y}else{state.p.x=HOME[0];state.p.y=HOME[1]+1.2}}
       {const mv=NV.migVivo;NV.migVivo=null;if(mv&&mv.id===id&&Date.now()-mv.t<120000){for(const k in mv.v)if(k!=='p'||canStand(mv.v.p.x,mv.v.p.y,.28))state[k]=mv.v[k];applyOutfit&&applyOutfit();updateHUD()}}      // era convidado e virou dono: continua do jeito que estava      // volta onde estava da última vez (ou na frente de casa)
       clearInterval(NV.hb);NV.hb=setInterval(nvBatida,NV_BATIDA);
       mpHospedar(sala);toast(`☁️ Você abriu o mundo ${w.nome||''}. Código para os amigos: ${id}`,9000);sfx.coin()})})
   .catch(e=>{NV.tentando=false;NV.status=e&&e.message==='save'?'O save da nuvem está estragado.':nvErro(e);openNuvem()})}
// a cada 15 s: avisa que está vivo; a cada 60 s: sobe o mundo
function nvBatida(){if(!NV.on||!NV.id)return;nvReq(NV.id+'/lock').then(lk=>{if(!NV.on)return;if(lk&&lk.id&&NV.lockId&&lk.id!==NV.lockId){nvPerdeuVez();return}return nvReq(NV.id+'/lock/t','PUT',NV_AGORA)}).catch(()=>{});
  if(Date.now()-NV.upT>NV_SUBIR)nvSubir()}
function nvSubir(){if(!NV.on||!NV.id||NV.subindo||curSlot!==NV_SLOT)return Promise.resolve(false);NV.subindo=true;NV.upT=Date.now();mpPosGuarda();
  const nick=nvChave(MP.nome||'Dono');if(!state.progDono)state.progDono=nick;
  for(const id in MP.players){const g=MP.players[id];if(!g.me&&g.nome&&g.inv)progGuarda(nvChave(g.nome),g)}      // o progresso de quem está na sala vai junto (se o dono cair, cada um continua com o seu)
  const up={save:JSON.stringify(state),'info/dia':state.day,'info/visto':NV_AGORA,'info/subiu':state.progDono};
  up['jogadores/'+nick]=nvMinhaPess();
  for(const id in MP.players){const g=MP.players[id];if(g.me||!g.nome)continue;up['jogadores/'+nvChave(g.nome)]=nvPessDe(g,(g.testoUntil||0)-absNow())}
  for(const k in NV.pend)up['jogadores/'+k]=NV.pend[k];
  return nvReq(NV.id,'PATCH',up).then(()=>{NV.subindo=false;NV.pend={};return true}).catch(()=>{NV.subindo=false;return false})}
// sair do mundo da nuvem (dono): sobe tudo, solta a chave e fecha a sala
function nvSair(depois){if(!NV.on){depois&&depois();return}const id=NV.id;NV.status='Salvando na nuvem…';toast('☁️ Salvando o mundo na nuvem…',4000);
  clearInterval(NV.hb);NV.subindo=false;
  nvSubir().then(ok=>nvReq(id+'/lock','DELETE').catch(()=>{}).then(()=>{NV.on=false;NV.lockId=null;
    if(MP.role==='host'){MP.nvBye=true;mpParar();MP.nvBye=false}
    try{localStorage.removeItem(SLOT_KEYS[NV_SLOT])}catch(e){}
    toast(ok?'☁️ Mundo salvo na nuvem. Até a próxima!':'☁️ Não deu para salvar na nuvem agora (sem internet?). O último envio ficou guardado.',7000);
    depois&&depois()}))}
// se o jogo fechar de repente, solta a chave (o mundo da nuvem fica com o último envio)
try{window.addEventListener&&window.addEventListener('pagehide',()=>{if(NV.on&&NV.id)try{nvReq(NV.id+'/lock','DELETE')}catch(e){}})}catch(e){}
// não conseguiu entrar na sala de quem está jogando: se ele sumiu (sem sinal há 25 s) ou já tentou 2 vezes, abre o mundo para você
function nvFalhou(id,msg){NV.tent=(NV.tent||0)+1;const conv=nvConvite(id);NV.status='Quem estava jogando não respondeu. Verificando…';openNuvem();
  nvReq(id+'/ping','PUT',NV_AGORA).then(t=>{const agora=+t||Date.now();return nvReq(id+'/lock').then(lk=>{
    if(!lk||agora-(+lk.t||0)>25000||NV.tent>=3){NV.tent=0;NV.ocupado=null;NV.status='Abrindo o mundo para você…';openNuvem();nvEntrar(conv,true)}
    else{NV.status=`Tentando entrar de novo (${NV.tent}/3)…`;openNuvem();setTimeout(()=>{if(!MP.role)nvEntrar(conv)},1500)}})}).catch(e=>{NV.tent=0;NV.status=msg||nvErro(e);openNuvem()})}
// quem está recebendo a turma confere se ainda é a vez dele (se outro abriu o mundo enquanto ele estava fora, para de salvar por cima)
function nvPerdeuVez(){const id=NV.id;clearInterval(NV.hb);NV.on=false;NV.lockId=null;if(MP.role==='host'){MP.nvBye=true;mpParar();MP.nvBye=false}
  try{localStorage.removeItem(SLOT_KEYS[NV_SLOT])}catch(e){}toast('☁️ Outro jogador abriu esse mundo enquanto você estava sem sinal. Entrando de novo…',8000);curSlot=null;setTimeout(()=>nvEntrar(nvConvite(id)),1200)}
// convidado de um mundo da nuvem: se o dono sair, alguém assume sozinho
// o convidado escolhido (o primeiro da sala) assume o mundo na hora; os outros esperam um pouco e entram na sala nova
function mpEleito(){const c=[MP.myId,...Object.keys(MP.players).filter(i=>i!=='h'&&i!==MP.myId)].filter(Boolean).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)));return c[0]===MP.myId}
function nvMigrar(nv,eu,txt){const vivo={};for(const k of MP_PESSOAL)if(state[k]!==undefined)vivo[k]=k==='p'?{x:state.p.x,y:state.p.y,dir:state.p.dir,walk:0,face:state.p.face||1}:JSON.parse(JSON.stringify(state[k]));
  MP.migrando=true;mpParar(null);MP.migrando=false;MP.nuvem=nv;NV.migVivo={id:nv,v:vivo,t:Date.now()};NV.tent=0;
  toast(`☁️ ${txt} ${eu?'Você vira o dono do mundo — ninguém sai do jogo.':'Trocando de dono… o mundo continua.'}`,6000);
  const conv=nvConvite(nv);setTimeout(()=>{MP.nuvem=null;if(!MP.role)nvEntrar(conv)},eu?300:4500+Math.random()*1500)}
function nvDonoSaiu(){const id=MP.nuvem;MP.nuvem=null;if(!id)return;const conv=nvConvite(id);

const isNight=()=>state.min>=1080||state.min<360;

  const n=2+(Math.random()<.5?1:0),slot=1440/n,el=dayElapsed();thiefPlan=[];
  for(let i=0;i<n;i++){const t=i*slot+slot*(.15+.7*Math.random());if(t>el+20)thiefPlan.push(t)}}
function respawnRocks(){let n=0;for(const k in state.depleted)if(objs[k]==='rock'){delete state.depleted[k];delete hp[k];n++}return n}      // pedras quebradas voltam a cada meio dia
function morning(){          // 6h: começa um novo dia
  if(MP.role==='host')for(const id in MP.players){const g=MP.players[id];if(!g.me)g.energy=Math.max(g.energy,maxEnergy())}
  state.napHoje=0;if(MP.role==='host')for(const id in MP.players){const g=MP.players[id];if(!g.me)g.napHoje=0}
  respawnRocks();      // dormindo, a meia-noite passa durante o sono
  state.forca.hoje=0;
  // lavoura: o que estava molhado cresce um dia
  for(const i in state.crops){const c=state.crops[i];if(isWet(c)&&!c.r){c.g++;if(c.g>=CROPS[c.c].dias)c.r=true}c.w=false}
  state.day++;ensureBolsa();if((state.day-1)%BOLSA_DIAS===0)bolsaDia();      // a bolsa troca os preços a cada 7 dias
  state.rain=Math.random()<RAIN_DAY;rollClima();
  for(const k in state.depleted)if(state.depleted[k]<=state.day)delete state.depleted[k];
  wild=wild.filter(a=>a.led||canStand(a.x,a.y,.3)&&!inVila(a.x,a.y));spawnWild();
  planThieves();
  funcDia();
  const inc=state.b.praca*15+rendaVilas();if(inc){state.coins+=inc;float(state.p.x,state.p.y-1,`+${brl(inc)} da vila`,'#f5c542');toast(`🏛️ Renda da vila: +${brl(inc)}${state.b.praca?` (Praça nível ${state.b.praca}: ${brl(state.b.praca*15)})`:''}${rendaVilas()?` + vilas do sul ${brl(rendaVilas())}`:''}`,7000)}
  save();
}

/* ---------- Vida (coração): com a fome zerada, esvazia em exatamente 1 minuto; em 0% o personagem cai e perde 5% do dinheiro ---------- */
const VIDA_SEG=60,MORTE_PERDA=.05;let morte=null;      // morte={t} enquanto o personagem está caído
const vidaPasso=(o,dt)=>{if(o.vida==null)o.vida=100;if(o.hunger<=0)o.vida=Math.max(0,o.vida-dt*100/VIDA_SEG);else if(o.vida>0&&o.vida<100)o.vida=Math.min(100,o.vida+dt*100/90)};

  else if(f.fomeLim!=null&&h>f.fomeLim+2){f.fomeLim=[25,10,1].find(l=>h>l)!=null?[25,10,1].filter(l=>h<=l).pop()??null:null}}

/* ---------- Ladrões de animais ---------- */
const D4=[[1,0],[-1,0],[0,1],[0,-1]],PEN_SPOT={galinheiro:[-112,44],curral:[-101,44]};
function flow(tx,ty){const d=new Int16Array(AW*MH).fill(-1),q=[ty*AW-XMIN+tx];d[q[0]]=0;
  for(let h=0;h<q.length;h++){const i=q[h],x=(i%AW+XMIN),y=(i/AW)|0;for(const[a,b]of D4){const nx=x+a,ny=y+b;if(nx<XMIN||ny<0||nx>=MW||ny>=MH)continue;
    const j=ny*AW-XMIN+nx;if(d[j]<0&&walkable(nx,ny)){d[j]=d[i]+1;q.push(j)}}}return d}
function follow(t,d,speed,dt){      // anda pelo campo de distâncias; devolve true ao chegar
  const x=Math.floor(t.x),y=Math.floor(t.y),i=y*AW-XMIN+x;if(d[i]===0)return true;if(d[i]<0)return null;
  let bx=x,by=y,bd=d[i];for(const[a,b]of D4){const nx=x+a,ny=y+b;if(nx<XMIN||ny<0||nx>=MW||ny>=MH)continue;const v=d[ny*AW-XMIN+nx];if(v>=0&&v<bd){bd=v;bx=nx;by=ny}}
  const dx=bx+.5-t.x,dy=by+.5-t.y,n=Math.hypot(dx,dy)||1,s=Math.min(n,speed*dt);t.x+=dx/n*s;t.y+=dy/n*s;t.walk+=dt*7;
  t.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');return false}
function spawnThief(){
  const pens=['galinheiro','curral'].filter(id=>penCount(id)>0);if(!pens.length)return false;
  const pen=pens[Math.random()*pens.length|0],[tx,ty]=PEN_SPOT[pen],d=flow(tx,ty),p=state.p;let c=[];
  for(const[lo,hi,far]of[[20,45,12],[12,60,8],[6,99,0]]){for(let i=0;i<d.length;i++){if(d[i]>=lo&&d[i]<=hi){const x=(i%AW+XMIN),y=(i/AW)|0;if(Math.hypot(x-p.x,y-p.y)>=far)c.push([x,y])}}if(c.length)break}
  const edge=c.filter(([x,y])=>x<=XMIN+1||y<=1||x>=MW-2||y>=MH-2);if(edge.length)c=edge;   // de preferência, vem e foge pela borda do mapa
  if(!c.length)return false;const e=c[Math.random()*c.length|0];
  thieves.push({x:e[0]+.5,y:e[1]+.5,st:'come',t:0,hp:4,pen,exit:e,fl:d,carry:null,dir:'down',walk:0,shoves:0,say:3.5,sayT:7});return true}
function dropCarry(t,quiet){const a=t.carry;if(!a)return;t.carry=null;state.animals.push(a);syncPens();
  if(!quiet)toast(`${SPECIES[a.sp].nome} voltou correndo para o ${BLD[SPECIES[a.sp].pen].nome}!`)}
function thiefGo(t,st){t.st=st;const g=st==='come'?PEN_SPOT[t.pen]:t.exit;t.fl=flow(g[0],g[1])}
const DOZE_R=9;      // distância para sacar a doze quando o ladrão começa a roubar
function dozeArma(){const ativos=thieves.filter(t=>t.st==='steal'||t.st==='segurado'||(t.st==='flee'&&t.carry));
  const pessoas=[{o:state,g:null}];for(const id in MP.players){const g=MP.players[id];if(!g.me&&g.p)pessoas.push({o:g,g})}
  for(const{o,g}of pessoas){const perto=ativos.some(t=>Math.hypot(t.x-o.p.x,t.y-o.p.y)<DOZE_R);
    if(perto&&!o.doze){o.doze=1;const fn=()=>{toast('🔫 Você sacou a doze! Aperte Espaço para atirar sal grosso no ladrão.',6000);sx('engatilha')};if(g)mpComo(g,fn);else fn()}
    if(!ativos.length&&o.doze)o.doze=0}}
function updateThieves(dt){
  for(const t of thieves.slice()){
    if(t.say>0)t.say-=dt;t.sayT-=dt;if(t.sayT<=0&&(t.st==='come'||t.st==='flee'||t.st==='steal'||t.st==='segurado')){t.say=sndDur('ladrao_grito',2.2,5);t.sayT=t.say+3+Math.random()*3;playSound('ladrao_grito',distVol(t))}
    if(t.st==='down'||t.st==='stun'){t.t-=dt;if(t.t<=0)thiefGo(t,penCount(t.pen)>0?'come':'flee');continue}
    let r=false;
    if(t.st==='come'){if(!penCount(t.pen)){thiefGo(t,'flee');continue}r=follow(t,t.fl,2.3,dt);if(r&&segAtiva(t.pen)&&(t.segT==null||t.segT>0)){r=false;const novo=t.segT==null;if(novo)t.segT=SEG_SEGURA;t.st='segurado';t.walk=0;
        if(novo)mpAviso(`❗🚨 Ladrão no ${BLD[t.pen].nome}! O tratador está segurando ele — vocês têm ${SEG_SEGURA} s para chegar!`,7000,'alarme')}
      else if(r){t.st='steal';t.t=4;t.walk=0;t.say=Math.max(3,sndDur('ladrao_grito',3,5));t.sayT=t.say+3;if(!playSound('ladrao_grito',distVol(t),true))sxPlay('ladraoGrito');mpAviso(`❗🚨 Um ladrão está roubando no ${BLD[t.pen].nome}! Empurre-o com Espaço.`,6000,'alarme')}}
    else if(t.st==='segurado'){t.segT-=dt;t.walk=0;if(!penCount(t.pen)){thiefGo(t,'flee');continue}if(t.segT<=0){t.segT=0;t.st='steal';t.t=1.5;mpAviso(`❗ O tratador não aguentou mais: o ladrão se soltou e está pegando um bicho do ${BLD[t.pen].nome}!`,6000,'no')}}
    else if(t.st==='steal'){t.t-=dt;const list=state.animals.filter(a=>SPECIES[a.sp].pen===t.pen);
      if(!list.length)thiefGo(t,'flee');
      else if(t.t<=0){const a=list[Math.random()*list.length|0];state.animals.splice(state.animals.indexOf(a),1);syncPens();t.carry=a;thiefGo(t,'flee');startDonkey();/* o burro só aparece depois que o ladrão já levou o animal */
        mpAviso(`❗ Um ladrão pegou ${animFem(a.sp)?'uma':'um'} ${SPECIES[a.sp].nome.toLowerCase()}! Empurrem com Espaço para recuperar.`,6000,'no')}}
    else if(t.st==='flee'){r=follow(t,t.fl,t.carry?1.9:2.8,dt);
      if(r){if(t.carry){mpAviso(`😩 O ladrão fugiu com ${animFem(t.carry.sp)?'uma':'um'} ${SPECIES[t.carry.sp].nome.toLowerCase()}...`,6000,'no');t.carry=null;save()}thieves.splice(thieves.indexOf(t),1)}}
    if(r===null){if(t.carry)dropCarry(t);thieves.splice(thieves.indexOf(t),1)}
  }
  dozeArma()}
const SHOVES_TO_FALL=4;      // empurrões até o ladrão cair (depois são 4 pisões para expulsar)
let shoveAlvo=null,shovePred=false,dozeFx=[];

      // convidado: o ladrão que ele viu na tela dele (pela internet a posição chega um pouco atrasada)
function shove(){if(MP.role==='guest'){if(MP.host&&MP.myId){const p=state.p;let al=null,ad=1.7;for(const t of thieves){const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<ad){ad=d;al=t}}

      else if(shoveCd<=0){shoveCd=.3;const fx0=p.dir==='left'?-1:p.dir==='right'?1:0,fy0=p.dir==='up'?-1:p.dir==='down'?1:0;pfx={x:p.x+fx0*.7,y:p.y+fy0*.7-.3,t:.18,stomp:!!(al&&al.st==='down')};

      dropCarry(t);t.st='down';t.t=Math.max(6,sndDur('ladrao_choro',5,8));t.shoves=0;t.say=0;t.hp=Math.min(t.hp,2);stopSound('ladrao_grito');
      const amigo=MP.cap&&MP.cap.g,by=amigo?amigo.id:'h';dozeTiroFx(p.x,p.y-.45,t.x,t.y-.5);if(!shovePred)sx('tiro');
      if(amigo&&Math.hypot(MP.cap.hostP.x-p.x,MP.cap.hostP.y-p.y)<22)sxPlay('tiro');      // o dono ouve o tiro do amigo
      if(MP.role==='host')mpBroadcast({t:'tiro',by,x1:p.x,y1:p.y-.45,x2:t.x,y2:t.y-.5});
      setTimeout(()=>{if(!playSound('ladrao_choro',1,true))sxPlay('ladraoCai')},350);float(t.x,t.y-1.1,'Caiu! Pise nele com Espaço','#fff');return}}
  for(const t of thieves){const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<bd){bd=d;best=t}}
  if(shoveAlvo){let ad=3.2,b2=null;for(const t of thieves){const d=Math.hypot(t.x-shoveAlvo.x,t.y-shoveAlvo.y);if(d<ad&&Math.hypot(t.x-p.x,t.y-p.y)<4.5){ad=d;b2=t}}if(b2)best=b2}      // o convidado acertou o ladrão na tela dele: vale, mesmo que aqui ele já tenha andado um pouco

  if(best){const dx=best.x-p.x,dy=best.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
  const fx=p.dir==='left'?-1:p.dir==='right'?1:0,fy=p.dir==='up'?-1:p.dir==='down'?1:0;

  else{best.st='stun';best.t=.8;float(best.x,best.y-1,`Empurrão! (${best.shoves}/${SHOVES_TO_FALL})`,'#fff')}
}

      <button class="m-btn" data-a="config">${I('⚙️','#e8e0ff')}<span>Personalizar<small>cabeças, sons, música</small></span></button>
      <button class="m-btn" data-a="mp">${I('🌐','#d9ecff')}<span>Multiplayer<small>${MP.role?'sala '+MP.code:'jogar com amigos'}</small></span></button>
      <button class="m-btn" data-a="${conv?'mpopen':'func'}" data-v="func">${I('👷','#ffe3c2')}<span>Funcionários<small>tratador e lavrador · tecla F</small></span></button>
      <button class="m-btn" data-a="zoomin">${I('🔍','#d9ecff')}<span>Aproximar<small>tudo maior · tecla +</small></span></button>
      <button class="m-btn" data-a="zoomout">${I('🗺️','#d9ecff')}<span>Afastar<small>ver mais mapa · tecla −</small></span></button>

    </div>
    <details><summary>Como jogar</summary>
      <div class="keys"><kbd>W A S D</kbd><span>ou setas: andar</span><kbd>E</kbd><span>(ou clique esquerdo do mouse) interagir · segurar perto de um animal para laçar · plantar, regar, colher · pescar</span>
        <kbd>Espaço</kbd><span>empurrão no ladrão; pisão quando ele cai</span><kbd>Q</kbd><span>trocar a semente em uso</span><kbd>L</kbd><span>arar terra: escolha as duas pontas e pague por canteiro</span><kbd>R</kbd><span>montar e descer da moto (loja do Alison, ao lado da ponte)</span><kbd>T</kbd><span>subir e descer do trator (concessionária do outro lado da ponte)</span><kbd>I</kbd><span>mochila</span><kbd>M</kbd><span>mapa geral</span><kbd>N</kbd><span>ligar ou desligar o som</span><kbd>Esc</kbd><span>este menu</span></div>
      <ul class="tips">
        <li><b>Recursos:</b> corte árvores e quebre pedras para construir e melhorar a vila.</li>
        <li><b>Animais:</b> lace, arraste até o Galinheiro ou o Curral da sua fazenda (Imbuial), alimente com ração (2 capim) e venda o que produzem para o <b>Mateus</b>, que fica ao lado da sua casa.</li>
        <li><b>Cidade e fazenda:</b> sua casa, os animais e o celeiro ficam em <b>Imbuial</b>; a Loja do Giliard, a praça, a igreja e o T.O.E.F.D Gym ficam em <b>Videira</b>. Siga as placas verdes.</li>
        <li><b>Triguinho:</b> casa de apostas do Junior Amaral no centro de Videira, aberta a noite inteira, das 18:00 às 6:00. Na roleta, verde paga o dobro da aposta; vermelho leva a aposta e mais 5% do seu dinheiro.</li>
        <li><b>Galinha T.O.E.F.D:</b> a mais rara de todas. A cada 5 minutos jogando há 1 chance em 500 de ela aparecer no mapa. Cada ovo dela vale R$ 3.000,00.</li>
        <li><b>Raridade dos animais:</b> cada galinha, pato, ovelha, porco e vaca nasce com uma raça: Comum, Incomum (×1,6), Rara (×2,5), Épica (×4) ou Lendária (×7). Quanto mais rara, menos aparece no mapa e mais valem os produtos dela.</li>
        <li><b>Clima:</b> cada dia pode ter um evento: tempestade com raios, granizo, neblina de manhã, geada e até neve no inverno, ventania, onda de calor (fome mais rápida) e arco-íris quando a chuva para no fim da tarde.</li>
        <li><b>Sujeira:</b> plantar, regar, colher e andar pela lavoura sujam o personagem; tome banho no chuveiro da casa. Moto e trator se sujam passando na terra arada: lave no lava-jato do posto. A chuva lava um pouquinho.</li>
        <li><b>Roupas:</b> você começa só de cueca. Na aba <b>Skin própria</b> da loja dá para usar uma imagem do seu PC (ou skin do Minecraft) como personagem: libera no nível 5 do personagem ou por R$ 5.000,00. Blusas, calças, calçados e chapéus são vendidos pelo <b>Luan</b> na <b>Pitol Calçados</b>, no centro de Videira. Troque de roupa no guarda-roupa da casa ou na mochila.</li>
        <li><b>Força:</b> treine no T.O.E.F.D Gym, em Videira. Sobe devagar, e cada treino no mesmo dia rende menos; o levantamento terra só libera na Força 4. Pagando R$ 100,00 ao <b>Gabriel</b>, você gasta 70% menos energia por 2 dias (Testosterona) e ganha mais força quanto mais horas tiver acumuladas: 42 h = 1,5× de força, 84 h = 2×, 126 h ou mais = 2,5× (o máximo). Vale treinando e quebrando coisas. Com Força 2 você usa o machado (vende na Loja).</li>
        <li><b>Nível do personagem (⭐):</b> sobe bem devagar enquanto você joga (1 XP por minuto) e a cada colheita (+2 XP). Cada nível libera construções e melhorias (galinheiro, curral, casa, praça e ponte), sementes novas na loja e dá 1 ponto de estudo na Unoesc. Lojas que travam: motos no nível 4, Pitol Calçados no 8, tratores no 10, caça-níquel do bar no 10 e Triguinho no 15. A Loja do Giliard, o Mateus, o bar (comida e bebida) e a academia não travam.</li>
        <li><b>Universidade:</b> a Unoesc Videira fica no sul do mapa. Cada nível do personagem dá 1 ponto de estudo; cada nível de um curso dá itens extras garantidos a cada coleta (de +1 a +10).</li>
        <li><b>Lavoura:</b> aperte <kbd>L</kbd> e clique nas duas pontas para arar terra onde quiser (R$ 5,00 por canteiro). Compre sementes na Loja (todas, o ano todo), plante, regue uma vez por dia e colha. A chuva rega sozinha.</li>
        <li><b>Pesca:</b> faça a vara na mochila (8 madeiras), fique de frente para a água, aperte <kbd>E</kbd> e de novo no "!". Às vezes vem um tesouro.</li>
        <li><b>Ladrão:</b> vem 2 ou 3 vezes por dia. Quatro empurrões derrubam; quatro pisões expulsam.</li>
        <li><b>Veículos:</b> motos com o Alison (ao lado da ponte, tecla <kbd>R</kbd>) e tratores do outro lado do rio (tecla <kbd>T</kbd>; plantam e colhem em área). Abasteça no posto, do outro lado da ponte, ao lado dos tratores; a gasolina aditivada deixa 25% mais rápido.</li>
        <li><b>Você:</b> coma para não passar fome e durma em casa à noite. De dia dá para cochilar no máximo 4 h.</li>
        <li><b>Horários de Videira:</b> a academia abre das 7:00 às 15:30; depois o Gabriel vai a pé até a <b>Barbearia do Gabriel</b> (ponta oeste da avenida), aberta das 16:00 às 18:30 (cabelo, cor, barba, bigode, banheira de cloro e bronzeamento). Pitol e A.C.C.P.U.V das 8:00 às 18:00, motos das 8:00 às 19:00, bar das 10:00 às 23:30. Fora do horário cada um volta a pé para a sua casa, perto do centro. O posto tem bomba de autoatendimento à noite; o lava-jato fica ao lado.</li>
        <li><b>Funcionários:</b> até 15 lavradores; eles se dividem pelas lavouras e cada um pega um canteiro diferente.</li>
      </ul></details>
    <div class="m-exit"><button class="alt" data-a="exportar">💾 Exportar mundo</button><button class="alt" data-a="trocarmundo">🌍 Trocar de mundo</button><button class="home" data-a="sairmenu">🏠 Sair para o menu inicial</button></div>
    <div class="m-foot"><span style="flex:1;text-align:center">O jogo salva sozinho ao amanhecer, a cada meio minuto e quando você sai.</span></div>
  </div>`);
}

function openSplash(){const sp=$('splash');if(!sp||!sp.classList){openTitle();return}
  let leaves='';const cols=['#7fb04f','#e8823a','#f2c218','#d4512a','#9bc65a'];for(let i=0;i<14;i++)leaves+=`<i class="leaf" style="left:${(i*7.3)%100}vw;background:${cols[i%5]};animation-duration:${7+i%5*1.7}s;animation-delay:-${i*1.3}s"></i>`;
  let clouds='';for(let i=0;i<4;i++)clouds+=`<i class="cloud" style="top:${10+i*8}vh;width:${14+i*6}vw;animation-duration:${38+i*11}s;animation-delay:-${i*13}s"></i>`;
  sp.innerHTML=`<div class="sun"></div>${clouds}<canvas class="hills spbg" id="spbg"></canvas><canvas class="spcv" id="spcv"></canvas>${leaves}
    <div class="logo"><b>Imbuial</b><b>Valley</b><small>Um vale tranquilo em Videira · SC</small></div>
    <img class="art" src="${CAPA}" alt="">
    <div class="spsexo" id="spsexo">${['h','m'].map(k=>`<button class="spsx${pSexo()===k?' on':''}" data-sx="${k}"><img src="${splashBoneco(k)}" alt=""><b>${k==='h'?'🎩 Cavalheiro':'👗 Dama'}</b></button>`).join('')}</div>
    <button class="play" id="splashplay">▶ JOGAR</button>
    <div class="hint">${isTouch?'toque em Jogar':'aperte Enter ou clique em Jogar'}</div><div class="ver">feito pelo Alison & Teus</div><button class="spquit" id="spquit">✖ Fechar jogo</button>
    <button class="spgear" id="spgear" title="Configurações">⚙️</button><div class="spcfg hidden" id="spcfg"><button id="spmus">${musicaOff?'🔇 Música desligada':'🎵 Música ligada'}</button><button id="spsom">${muted?'🔇 Efeitos desligados':'🔊 Efeitos ligados'}</button></div>`;
  {const gb=$('spgear'),bx=$('spcfg'),mb=$('spmus'),sb=$('spsom');if(gb&&gb.addEventListener){const pare=ev=>{ev.stopPropagation()};
    gb.addEventListener('click',ev=>{pare(ev);getCtx();bx.classList.toggle('hidden')});bx.addEventListener('click',pare);
    mb.addEventListener('click',ev=>{pare(ev);musicaToggle();mb.textContent=musicaOff?'🔇 Música desligada':'🎵 Música ligada'});
    sb.addEventListener('click',ev=>{pare(ev);muted=!muted;musicaAplica();sb.textContent=muted?'🔇 Efeitos desligados':'🔊 Efeitos ligados'})}}
  {const bx=$('spsexo');if(bx&&bx.addEventListener)bx.addEventListener('click',ev=>{ev.stopPropagation();const b=ev.target.closest&&ev.target.closest('[data-sx]');if(!b)return;
    try{localStorage.setItem('imbuial_valley_sexo',b.dataset.sx)}catch(e){}for(const q of bx.querySelectorAll('.spsx'))q.classList.toggle('on',q===b);getCtx&&getCtx();beep(660,.08,'square',.04);if(state)applyOutfit()})}
  sp.classList.remove('hidden','hide');drawSplashBg();
  const go=()=>{if(sp.classList.contains('hide'))return;getCtx&&getCtx();beep(523,.1,'square',.04);setTimeout(()=>beep(784,.16,'square',.04),110);sp.classList.add('hide');setTimeout(()=>{sp.classList.add('hidden');sp.classList.remove('hide')},600);openTitle()};
  sp.onclick=go;splashGo=go;{const q=$('spquit');if(q)q.onclick=ev=>{ev.stopPropagation();ACT.fecharjogo()}}startSplashAnim()}

/* ---------- Fundo da tela de abertura desenhado com os gráficos do próprio jogo ---------- */
function splashBoneco(k){const eq=k==='h'?{hat:'palha',shirt:'xadrez',pants:'jeans',shoes:'botina'}:{shirt:'cam_rosa',pants:'jeans',shoes:'tenis_branco'};
  return outfitPreview(eq,3,{skin:VIS_PELE,hair:k==='h'?VIS_CABELO:'#8a5a2a',hairStyle:k==='h'?'curto':'comprido',beard:null,stache:null,dama:k==='m'})}
function drawSplashBg(){const cv=$('spbg');if(!cv||!cv.getContext)return;const W=cv.clientWidth|0,H=cv.clientHeight|0;if(!W||!H)return;cv.width=W;cv.height=H;
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;const R=mulberry32(7),s=Math.max(2,Math.round(innerHeight/190)),sb=Math.max(2,s-1),T16=16*sb;
  const put=(img,x,footY,k)=>{if(!img)return;const sc=(img.sc||S)/S*k,w=img.width*sc,h=img.height*sc;g.drawImage(img,Math.round(x-w/2),Math.round(footY-h+(img.pad||0)*k),w,h)};
  // morros do fundo com silhueta de araucária
  const hz=H*.3;g.fillStyle='#603a5c';g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=8)g.lineTo(x,hz-6+Math.sin(x*.012)*7+Math.sin(x*.031+1)*4);g.lineTo(W,H);g.fill();
  g.fillStyle='#3a1e3c';for(let x=10;x<W;x+=70+((x*7)%40)){const y=hz-4+Math.sin(x*.012)*7,hh=26+(x%3)*6;g.fillRect(x,y-hh,2,hh);for(const[dy,w]of[[0,9],[4,13],[8,15],[12,12]])g.fillRect(x-w/2+1,y-hh+dy,w,3)}
  // campo com textura de grama do jogo
  const gy0=H*.36;g.fillStyle='#4c9140';g.fillRect(0,gy0,W,H-gy0);
  for(let y=gy0;y<H;y+=sb*2)for(let x=0;x<W;x+=sb*2){const v=R();if(v<.18){g.fillStyle=v<.08?'#3f7f35':'#5aa64a';g.fillRect(x,y,sb*2,sb*2)}}
  g.fillStyle='#3a8634';g.beginPath();g.moveTo(0,gy0);for(let x=0;x<=W;x+=10)g.lineTo(x,gy0-4+Math.sin(x*.02)*5);g.lineTo(W,gy0+20);g.lineTo(0,gy0+20);g.fill();
  // rio atravessando o campo
  {const rx=W*.68;g.fillStyle='#3d7fb8';g.beginPath();g.moveTo(rx-30,gy0);g.bezierCurveTo(rx+20,H*.4,rx-80,H*.62,rx-10,H);g.lineTo(rx+70,H);g.bezierCurveTo(rx,H*.62,rx+60,H*.4,rx+10,gy0);g.fill();
    g.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<14;i++){const yy=gy0+R()*(H-gy0),xx=rx-10+Math.sin(yy*.02)*30+R()*30;g.fillRect(xx,yy,sb*4,sb)}}
  // estrada de chão onde a turma passa
  g.fillStyle='#c9a46a';g.fillRect(0,H*.9,W,H*.1);g.fillStyle='#b38a52';for(let x=0;x<W;x+=sb*6)g.fillRect(x+(x*7)%11,H*.9+((x*13)%9)*sb,sb*2,sb);g.fillStyle='#a07a46';g.fillRect(0,H*.9,W,sb)
  // fileira de árvores do jogo (imbuias, araucárias e sakuras)
  const back=[];for(let x=-20;x<W+40;x+=T16*.9+R()*T16*.7){const r=R();back.push([x,gy0+T16*.35+R()*T16*.5,r])}
  back.sort((a,b)=>a[1]-b[1]);const kt=sb*.42;for(const[x,y,r]of back){if(Math.abs(x-W*.68)<T16*1.2)continue;const xi=Math.abs(x|0),im=r<.22?mkPine(2,1):r<.36?mkSakura(xi%4,1):mkTree(((xi/7)|0)%10,1+(xi%2),r>.85);put(im,x,y,kt)}
  // Videira ao longe: lojas de verdade, encolhidas
  try{const lojas=[barbSprite(),accSprite(),trigSprite(),pitolSprite(),gymSprite(),churchSprite()];let lx=W*.05;const ly=H*.6;
    for(const im of lojas){const k=sb*.42;put(im,lx+im.width*k/2,ly,k);lx+=im.width*k+T16*.5;if(lx>W*.6)break}}catch(e){}
  // árvores da frente, capim e flores
  for(let i=0;i<16;i++){const x=R()*W,y=H*.62+R()*H*.24;if(Math.abs(x-W*.68)<T16*1.5)continue;const r=R();
    put(r<.5?mkCapim((i%5),1+(i%2)):r<.8?mkBush(1,r<.6):mkRock(i%3,1,0),x,y,sb*.55)}
  for(const x of[W*.03,W*.97]){put(mkTree(3,2,0),x,H*.97,sb*.75)}
  for(let i=0;i<60;i++){g.fillStyle=['#f2c218','#e8823a','#ffffff','#e88fb5'][i%4];g.fillRect(R()*W,H*.6+R()*H*.28,sb,sb)}}

let spA=null;
function deerSpr(f){return outline(mk(20,15,(r,e)=>{const c='#a8693a',d='#7a4a24',l='#e8c79a';
  e(9,7,6,3,c);r(4,5,3,3,c);r(14,3,4,5,c);r(17,4,3,2,c);r(19,5,1,1,'#222');r(16,4,1,1,'#222');r(15,2,1,2,d);r(14,0,1,3,d);r(16,0,1,2,d);r(13,1,1,1,d);r(17,0,2,1,d);   // corpo, cabeça e chifres
  r(3,4,2,2,'#fff');e(9,9,5,1,l);
  const L=f?[[5,9,1],[7,9,-1],[11,9,1],[13,9,-1]]:[[4,9,0],[7,9,0],[11,9,0],[14,9,0]];
  for(const[x,y,k]of L){r(x+(f?k:0),y,2,4,d);r(x+(f?k*2:0),y+4,2,2,d)}}))}
function ensureSpA(){if(!spA){spA={farmer:personSet({hat:'#d9b45a',shirt:'#b5362d',pants:'#3d5f9e',skin:'#e8b88a'}),
    gritao:personSet({hat:'#2f8a3a',shirt:'#f5d142',pants:'#2b2f35',skin:'#c99570'}),deer:[deerSpr(0),deerSpr(1)]}}return spA}
function startSplashAnim(){const cv=$('spcv');if(!cv||!cv.getContext)return;ensureSpA();
  spA.t0=performance.now();spA.on=true;requestAnimationFrame(splashFrame)}
function splashFrame(now){const sp=$('splash'),cv=$('spcv');if(!sp||!cv||!cv.getContext||sp.classList.contains('hidden')){if(spA)spA.on=false;return}
  const W=cv.clientWidth|0,H=cv.clientHeight|0;if(!W||!H){requestAnimationFrame(splashFrame);return}
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  const g=cv.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,W,H);
  const t=(now-spA.t0)/1000,P=18,u=t%P,s=Math.max(2,Math.round(innerHeight/190)),sb=Math.max(2,s-1);

function objective(){
  const b=state.b,f=state.flags;
  if(!b.galinheiro)return state.inv.madeira<10?`Corte árvores com E e junte 10 madeiras (${state.inv.madeira}/10)`:'Construa o Galinheiro na sua fazenda, em Imbuial (siga a placa ao sul da estrada)';
  if(!f.captured)return'Capture uma galinha: segure E para laçar e arraste até o Galinheiro';
  if(!f.fed)return'Alimente seus animais no Galinheiro (ração = 2 capim, na mochila)';
  if(!f.collected)return'Espere a produção e colete os ovos no Galinheiro';
  if(!f.sold)return'Venda os produtos para o Mateus, ao lado da sua casa';
  if(!Object.keys(state.soil).length)return'Prepare a lavoura: aperte L, escolha as duas pontas e pague para arar';
  if(!f.harvest)return'Plante sementes na Lavoura, regue todo dia e colha';
  if(!f.fish)return f.rod?'Pesque no rio ou no lago: E de frente para a água, e E de novo no "!"':'Faça uma vara de pescar na mochila (8 madeiras)';
  if(!b.curral)return'Junte recursos e construa o Curral para animais maiores';
  if(!b.praca)return'Construa a Praça para atrair moradores';
  if(!b.ponte)return'Construa a Ponte (placa a leste) e chegue ao pasto das vacas';
  {const ti=titleInfo(vilaLevel()),nx=titleInfo(ti.ate).nome;return`Melhore as construções até virar ${nx} (nível ${vilaLevel()}/${ti.ate})`}

  T_.addEventListener('touchstart',ev=>{if(!hudEditing)return;const el=ev.target.closest('[data-h]');if(!el)return;ev.preventDefault();ev.stopPropagation();const t=ev.changedTouches[0],r=el.getBoundingClientRect(),sc=HUD.size[el.dataset.h]||1;
    drag={el,id:t.identifier,ox:t.clientX-(r.left+r.width/2),oy:t.clientY-(r.top+r.height/2),w:r.width/sc,h:r.height/sc,moved:false};
    for(const x of hudEls())x.classList.toggle('sel',x===el);hudSel=el.dataset.h},{capture:true,passive:false});
  T_.addEventListener('touchmove',ev=>{if(!hudEditing||!drag)return;ev.preventDefault();ev.stopPropagation();for(const t of ev.changedTouches)if(t.identifier===drag.id){
      const cx=clamp(t.clientX-drag.ox,20,innerWidth-20),cy=clamp(t.clientY-drag.oy,20,innerHeight-20);drag.moved=true;HUD.pos[drag.el.dataset.h]=[(cx-drag.w/2)/innerWidth,(cy-drag.h/2)/innerHeight];applyHud()}},{capture:true,passive:false});
  T_.addEventListener('touchend',ev=>{if(!hudEditing||!drag)return;ev.preventDefault();ev.stopPropagation();drag=null;renderHudEdit()},{capture:true,passive:false});
  $('hudedit').addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&!b.disabled&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v)});
  $('hudedit').addEventListener('input',ev=>{const k=ev.target.dataset.hud;if(!k)return;
    if(k==='size'){const v=ev.target.value/100;if(hudSel)HUD.size[hudSel]=v;else for(const el of hudEls())HUD.size[el.dataset.h]=v;ev.target.nextElementSibling.textContent=ev.target.value+'%'}
    if(k==='op'){HUD.op=ev.target.value/100;ev.target.nextElementSibling.textContent=ev.target.value+'%'}
    if(k==='hold')HUD.hold=ev.target.checked;applyHud()});
  $('hudedit').addEventListener('change',ev=>{if(ev.target.dataset.hud==='hold'){HUD.hold=ev.target.checked}});
  addEventListener('resize',()=>setTimeout(applyHud,50))}

function updateHold(dt){if(!keys.e||!HUD.hold||paused||lasso||fish){holdT=0;return}holdT+=dt;if(holdT<.38)return;holdT=.08;
  const t=findTarget();if(t&&(t.k==='obj'||t.k==='soil'))interact()}
function setupTouch(){loadHud();if(!isTouch)return;document.body.classList.add('touch');const T_=$('touch');T_.classList.remove('hidden');
  // botões: segurar E continua valendo para o laço
  for(const b of T_.querySelectorAll('.tb')){const k=b.dataset.k;
    b.addEventListener('touchstart',ev=>{ev.preventDefault();if(hudEditing)return;b.classList.add('on');try{actx&&actx.resume&&actx.resume()}catch(e){}key(k==='escape'?'Escape':k)},{passive:false});
    const up=ev=>{ev.preventDefault();if(hudEditing)return;b.classList.remove('on');key(k==='escape'?'Escape':k,'keyup')};b.addEventListener('touchend',up,{passive:false});b.addEventListener('touchcancel',up,{passive:false})}
  // controle analógico: vira as teclas W A S D
  const pad=T_.querySelector('.pad'),knob=T_.querySelector('.knob');let id=null;
  const set=(dx,dy)=>{const d=Math.hypot(dx,dy),m=Math.min(d,48),a=Math.atan2(dy,dx);knob.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`;
    const on=d>14;keys.d=on&&Math.cos(a)>.38;keys.a=on&&Math.cos(a)<-.38;keys.s=on&&Math.sin(a)>.38;keys.w=on&&Math.sin(a)<-.38};
  const mv=ev=>{for(const t of ev.changedTouches)if(t.identifier===id){const r=pad.getBoundingClientRect();set(t.clientX-r.left-r.width/2,t.clientY-r.top-r.height/2)}ev.preventDefault()};
  pad.addEventListener('touchstart',ev=>{if(hudEditing)return;id=ev.changedTouches[0].identifier;mv(ev)},{passive:false});pad.addEventListener('touchmove',mv,{passive:false});
  const end=ev=>{for(const t of ev.changedTouches)if(t.identifier===id){id=null;knob.style.transform='';keys.w=keys.a=keys.s=keys.d=false}ev.preventDefault()};
  pad.addEventListener('touchend',end,{passive:false});pad.addEventListener('touchcancel',end,{passive:false});setupHudEdit();applyHud()}

let zoom=1;      // canvas desenhado em innerWidth*zoom: menor = tudo maior na tela
const ZOOMS=[.55,.62,.7,.78,.86,.95,1.05,1.2,1.35,1.5,1.7];
let zoomI=(()=>{try{const v=localStorage.getItem('imbuial_valley_zoom');return v==null?-1:Math.max(0,Math.min(ZOOMS.length-1,+v|0))}catch(e){return-1}})();
function setZoom(d){const z0=zoomI;zoomI=Math.max(0,Math.min(ZOOMS.length-1,zoomI+d));if(zoomI===z0)return;try{localStorage.setItem('imbuial_valley_zoom',zoomI)}catch(e){}resize();toast(`🔍 Zoom ${Math.round(100/zoom)}%`,1500)}
function resize(){try{pausaPintada=false}catch(e){}if(zoomI<0)zoomI=Math.min(innerWidth,innerHeight)<560?ZOOMS.indexOf(1.2):ZOOMS.indexOf(.78);zoom=ZOOMS[zoomI];
  cv.width=Math.round(innerWidth*zoom);cv.height=Math.round(innerHeight*zoom);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.imageSmoothingEnabled=false;
  document.documentElement.style.setProperty('--top',Math.round(SKYH/zoom+(zoom>1?4:14))+'px')}

addEventListener('keydown',ev=>{
  if(splashGo&&!$('splash').classList.contains('hidden')&&(ev.key==='Enter'||ev.key===' ')){splashGo();ev.preventDefault();return}
  {const tg=ev.target,txt=tg&&(tg.tagName==='TEXTAREA'||tg.tagName==='INPUT'&&!/^(range|checkbox|radio|button|color)$/i.test(tg.type||'')),vis=tg&&tg.offsetParent!==null&&!(tg.closest&&tg.closest('.hidden'));
   if(tg&&tg!==document.body&&(!vis||!txt||ev.key==='Escape')&&tg.blur)tg.blur();      // foco preso num controle (ex.: volume da música) não pode travar o teclado
   else if(txt&&vis){if(ev.key==='Enter'&&titleMode&&titleMode.criar!=null)ACT.criarok(titleMode.criar);return}}
  const k=ev.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))ev.preventDefault();
  if(k==='escape'&&panelKind==='title')return;      // tela de mundos fica fixa: Esc não fecha
  if(morte){if((k==='enter'||k===' ')&&panelKind==='morte')ACT.acordar();return}      // caído: só dá para acordar
  if(k==='escape'&&panelKind==='config'&&cfgDoTitulo){openTitle();return}      // Personalizar aberto pela tela de mundos: Esc volta pra ela
  if(!state||panelKind==='title')return;
  if(busRide){if(k===' '||k==='enter'||k==='escape'||k==='e')busEnd();return}      // pular a viagem de ônibus
  if(MP.role&&k==='enter'&&!panelKind){openMP();setTimeout(()=>{const i=$('mpmsg');if(i&&i.focus)i.focus()},50);return}      // Enter: conversar com a sala
  if(MP.role==='guest'&&MP.myId){const op={i:'inv',b:'bolsa',f:'func'}[k];if(op){if(panelKind)closePanel();else mpSend(MP.host,{t:'open',w:op});return}}
  if(k==='n'){muted=!muted;musicaAplica();toast(muted?'Som desligado (N liga de novo)':'Som ligado');return}      // N: som
  if(k==='+'||k==='='||k==='add'){setZoom(-1);return}if(k==='-'||k==='_'||k==='subtract'){setZoom(1);return}      // + aproxima, − afasta
  if(k==='escape'){if(panelKind==='arar'){ACT.plowcancel();return}if(plow&&!panelKind){endPlow();return}if(panelKind)closePanel();else openMenu();return}
  if(k==='i'){if(panelKind==='inv')closePanel();else if(!panelKind)openInv();return}
  if(k==='m'){if(panelKind==='mapa')closePanel();else if(!panelKind)openMap();return}      // M: mapa
  if(k==='b'){if(panelKind==='bolsa')closePanel();else if(!panelKind)openBolsa();return}
  if(k==='f'){if(panelKind==='func')closePanel();else if(!panelKind)openFunc();return}
  if(paused)return;
  if(k==='e'&&!ev.repeat&&!keys[k]){keys[k]=true;interact();return}
  if(k===' '){if(!ev.repeat)shove();return}
  if(k==='q'){if(!ev.repeat)cycleSeed();return}
  if(k==='r'){if(!ev.repeat)toggleRide('moto');return}
  if(k==='t'){if(!ev.repeat)toggleRide('trator');return}
  if(k==='l'){if(!ev.repeat){if(plow)endPlow();else startPlow()}return}
  keys[k]=true;
});
